<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Facturation</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--sf:#fff;--tx:#1d2a26;--mu:#6b7873;--ac:#1c2d70;--ac2:#e5e9f6;--bd:#dcdad2;--rd:#b3402f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--sf:#1d212c;--tx:#e8eaf0;--mu:#9aa1b5;--ac:#5b72d6;--ac2:#252c4d;--bd:#323848;--rd:#e5806f}}
:root[data-theme="dark"]{--bg:#14171f;--sf:#1d212c;--tx:#e8eaf0;--mu:#9aa1b5;--ac:#5b72d6;--ac2:#252c4d;--bd:#323848;--rd:#e5806f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;gap:4px;flex-wrap:wrap;padding:12px 16px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{margin-right:12px;align-self:center;color:var(--ac)}
nav button{background:none;border:0;color:var(--mu);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac2);color:var(--ac);font-weight:600}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:16px}
h2{margin:0 0 14px;font-size:20px}h3{margin:0 0 10px;font-size:15px;color:var(--mu);font-weight:600}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.ln{display:grid;grid-template-columns:3fr 70px 100px 90px 32px;gap:8px;align-items:center;margin-bottom:8px}
.ln span{text-align:right;font-variant-numeric:tabular-nums}.lh{color:var(--mu);font-size:13px;margin-bottom:4px}.lh span{text-align:left}.lh span:nth-child(4){text-align:right}
.btn{background:var(--ac);color:#fff;border:0;padding:10px 18px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.btn.s{background:var(--ac2);color:var(--ac)}.btn.d{background:none;color:var(--rd);padding:6px 10px}
.num{font-size:26px;font-weight:700;color:var(--ac);font-variant-numeric:tabular-nums}
.tot{text-align:right;margin-top:10px;line-height:1.8}.tot b{font-size:18px}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.it:first-of-type{border-top:0}.it small{color:var(--mu);display:block}
.acts{display:flex;gap:6px;flex-shrink:0}
.empty{color:var(--mu);text-align:center;padding:20px}.gh{font-weight:700;color:var(--ac);margin:14px 0 2px;padding-top:6px}.gh:first-child{margin-top:0}
#msg{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:8px;display:none;z-index:9}
@media(max-width:560px){.ln{grid-template-columns:1fr 1fr}.ln select{grid-column:1/3}.lh span:nth-child(1),.lh span:nth-child(4),.lh span:nth-child(5){display:none}}
</style></head><body>

var COL={dest:'destinataires',lib:'libelles'};

function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function eur(n){return (+n||0).toFixed(2).replace('.',',')+' €'}
function toast(t){var m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){m.style.display='none'},4000)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fr(d){return d.split('-').reverse().join('/')}
function fyOf(d){var y=+d.slice(0,4);return +d.slice(5,7)>=9?y:y-1}
function nextNum(){var d=today();return d.slice(0,4)+'-'+d.slice(5,7)+'-'+String((S.fy===fyOf(d)?S.n:0)+1).padStart(3,'0')}
function rec(d){var o=Object.assign({},d.data());o.id=d.id;return o}
var COLL=new Intl.Collator('fr',{sensitivity:'base',numeric:true,ignorePunctuation:true});
function byName(a,b){return COLL.compare(String(a.name||'').trim(),String(b.name||'').trim())}
function grp(d){return d.groupe=='club'?'club':'autre'}
function byGroup(a,b){return (grp(a)=='club'?0:1)-(grp(b)=='club'?0:1)||byName(a,b)}
function destOpts(){var o=function(g){return S.dest.filter(function(d){return grp(d)==g}).map(function(d){return '<option value="'+esc(d.id)+'"'+(F.dest==d.id?' selected':'')+'>'+esc(d.name)+'</option>'}).join('')};return '<optgroup label="Clubs">'+o('club')+'</optgroup><optgroup label="Autres">'+o('autre')+'</optgroup>'}
function b64blob(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new Blob([a],{type:'application/pdf'})}
async function init(){
 if(!window.supabase||SUPABASE_URL.indexOf('COLLER')==0){$('app').innerHTML='<div class="card"><h2>Configuration manquante</h2>Renseignez SUPABASE_URL et SUPABASE_KEY en haut du fichier index.html.</div>';return}
 sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 var r=await sb.auth.getSession();r.data.session?start():login()}
function login(){$('nav').innerHTML='';
 $('app').innerHTML='<div class="card" style="max-width:380px;margin:40px auto"><h2>Connexion</h2><label>Email</label><input id="em" type="email" autocomplete="username"><label>Mot de passe</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')doLogin()"><div style="margin-top:14px"><button class="btn" onclick="doLogin()">Se connecter</button></div></div>'}
async function doLogin(){var r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(r.error)return toast('Connexion refusée : identifiants incorrects');start()}
function logout(){sb.auth.signOut().then(login)}
async function start(){await refresh();render()}
async function refresh(){
 var fy=fyOf(today());
 var a=await Promise.all([sb.from('destinataires').select('*'),sb.from('libelles').select('*'),sb.from('factures').select('*'),sb.from('compteur').select('dernier').eq('exercice',fy)]);
 var er=a.find(function(x){return x.error});if(er)toast('Erreur de chargement : '+er.error.message);
 S.dest=(a[0].data||[]).sort(byGroup);S.lib=(a[1].data||[]).sort(byName);
 S.arch=(a[2].data||[]).sort(function(x,y){return String(y.num).localeCompare(String(x.num))});
 S.fy=fy;S.n=a[3].data&&a[3].data[0]?a[3].data[0].dernier:0}
async function add(k){var o={};FLD[k].forEach(function(f,i){var v=$('f'+i).value.trim();o[f[0]]=f[0]=='price'?(+v||0):v});
 if(!o.name)return toast('Saisissez un nom');
 var t=sb.from(COL[k]),r=(ED&&ED.k==k)?await t.update(o).eq('id',S[k][ED.i].id):await t.insert(o);
 if(r.error)return toast('Erreur : '+r.error.message);
 ED=null;await refresh();render()}
async function delItem(k,i){var id=S[k][i].id,r=await sb.from(COL[k]).delete().eq('id',id);if(r.error)return toast('Erreur : '+r.error.message);if(F.dest==id)F.dest='';await refresh();render()}
async function dl(i){var a=S.arch[i],r=await sb.storage.from('factures').createSignedUrl(a.path,60,{download:a.name});
 if(r.error)return toast('Téléchargement impossible : '+r.error.message);
 var l=document.createElement('a');l.href=r.data.signedUrl;document.body.appendChild(l);l.click();l.remove()}
async function delArch(i){var a=S.arch[i];if(!confirm('Supprimer cette facture de l’archive ? Le numéro ne sera pas réutilisé.'))return;
 await sb.storage.from('factures').remove([a.path]);var r=await sb.from('factures').delete().eq('id',a.id);
 if(r.error)return toast('Erreur : '+r.error.message);await refresh();render()}
async function go(p){page=p;ED=null;await refresh();render()}
function render(){
 var t=['Nouvelle facture','Destinataires','Libellés','Archives'];
 $('nav').innerHTML=t.map(function(x,i){return '<button class="'+(page==i+1?'on':'')+'" onclick="go('+(i+1)+')">'+(i+1)+'. '+x+'</button>'}).join('')+'<button onclick="logout()">Déconnexion</button>';
 $('app').innerHTML=[p1,p2,p3,p4][page-1]();
 if(page==1){calc();showDest()}
}
function showDest(){var e=$('di'),d=S.dest.find(function(x){return x.id==F.dest});if(!e)return;
 e.innerHTML=d?[d.name,d.addr,d.city].filter(Boolean).map(function(x,i){return '<div'+(i?'':' style="font-weight:600"')+'>'+esc(x)+'</div>'}).join(''):''}
function p1(){
 return '<div class="card"><h3>Facture n°</h3><div class="num" id="num">'+nextNum()+'</div><div style="color:var(--mu)">Date : '+fr(today())+'</div>'
 +'<label>Destinataire</label><select id="dest" onchange="F.dest=this.value;showDest()"><option value="">— Choisir (page 2) —</option>'
 +destOpts()+'</select><div id="di" style="margin-top:10px"></div></div>'
 +'<div class="card"><h3>Libellés</h3><div class="ln lh"><span>Libellé</span><span>Quantité</span><span>P.U. (€)</span><span>Total</span><span></span></div>'+L.map(function(l,i){
  return '<div class="ln"><select onchange="pick('+i+',this.value)"><option value="">— Libellé (page 3) —</option>'
  +S.lib.map(function(x,j){return '<option value="'+j+'"'+(l.lib===x.name?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'</select>'
  +'<input type="number" min="0" step="any" value="'+l.q+'" oninput="L['+i+'].q=+this.value;calc()">'
  +'<input type="number" min="0" step="0.01" value="'+l.p+'" oninput="L['+i+'].p=+this.value;calc()">'
  +'<span id="t'+i+'"></span><button class="btn d" onclick="L.splice('+i+',1);if(!L.length)L.push({lib:\'\',q:1,p:0});render()">✕</button></div>'}).join('')
 +'<button class="btn s" onclick="L.push({lib:\'\',q:1,p:0});render()">+ Ajouter une ligne</button>'
 +'<div class="tot"><b>Total : <span id="ttc"></span></b></div></div>'
 +'<div class="card"><h3>Acquittée</h3><label style="display:flex;gap:10px;align-items:center;margin:0;color:var(--tx);font-size:15px"><input type="checkbox" style="width:auto" '+(A.on?'checked':'')+' onchange="A.on=this.checked;if(A.on&&!A.date)A.date=today();render()"> Cocher si la facture est acquittée</label>'
 +(A.on?'<div style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span>Acquittée par</span><select style="width:auto" onchange="A.mode=this.value">'+['Virement bancaire','Chèque','Espèces'].map(function(m){return '<option'+(A.mode==m?' selected':'')+'>'+m+'</option>'}).join('')+'</select><span>le</span><input type="date" style="width:auto" value="'+A.date+'" oninput="A.date=this.value"></div>':'')+'</div>'
 +'<button class="btn" onclick="valider()">Valider et générer le PDF</button>'}
function pick(i,j){if(j===''){L[i].lib='';return}var x=S.lib[j];L[i].lib=x.name;L[i].p=+x.price;render()}
function total(){return L.reduce(function(a,l){return a+l.q*l.p},0)}
function calc(){L.forEach(function(l,i){var e=$('t'+i);if(e)e.textContent=eur(l.q*l.p)});var e=$('ttc');if(e)e.textContent=eur(total())}
async function valider(){
 if(busy)return;
 var d=S.dest.find(function(x){return x.id==F.dest});
 if(!d)return toast('Choisissez un destinataire');
 var lines=L.filter(function(l){return l.lib&&l.q>0});
 if(!lines.length)return toast('Ajoutez au moins un libellé');
 if(A.on&&!A.date)return toast('Choisissez la date d’acquittement');
 if(!window.jspdf)return toast('Bibliothèque PDF indisponible');
 busy=true;
 try{
  var date=today(),rn=await sb.rpc('reserver_numero',{p_date:date});if(rn.error)throw rn.error;
  var num=rn.data,T=lines.reduce(function(a,l){return a+l.q*l.p},0);
  var doc=new window.jspdf.jsPDF(),y=22;
  try{doc.addImage(LOGO,'PNG',20,12,48,18.6)}catch(e){}
  doc.setFontSize(20);doc.text('FACTURE N° '+num,105,82,{align:'center'});doc.setFontSize(11);doc.text('Date : '+fr(date),105,90,{align:'center'});
  doc.setFont('helvetica','bold');doc.text('Destinataire',120,y+10);doc.setFont('helvetica','normal');doc.text(doc.splitTextToSize([d.name,d.addr,d.city].filter(Boolean).join('\n'),70),120,y+16);var nl=doc.splitTextToSize(ASSO.name,90);doc.setFont('helvetica','bold');doc.text(nl,20,44);doc.setFont('helvetica','normal');
  doc.text(ASSO.lines,20,44+5*nl.length+1);
  
  
  y=105;doc.setFillColor(28,45,112);doc.rect(20,y-6,170,9,'F');doc.setTextColor(255);
  doc.text('Libellé',23,y);doc.text('Qté',115,y);doc.text('P.U.',140,y);doc.text('Total',190,y,{align:'right'});doc.setTextColor(0);y+=10;
  lines.forEach(function(l){var t=doc.splitTextToSize(l.lib,85);doc.text(t,23,y);doc.text(String(l.q).replace('.',','),115,y);doc.text(eur(l.p),140,y);doc.text(eur(l.q*l.p),190,y,{align:'right'});y+=Math.max(9,5*t.length+3)});
  y+=6;doc.line(120,y-4,190,y-4);
  doc.setFont('helvetica','bold');doc.text('Total',120,y);doc.text(eur(T),190,y,{align:'right'});
  var pd=A.on,fy=232;if(y>(pd?190:205)){doc.addPage();fy=pd?45:20}
  if(pd){var ta='Acquittée par '+A.mode.toLowerCase()+' le '+fr(A.date);doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(200,0,0);doc.text(ta,20,fy-12);try{doc.addImage(TAMPON,'PNG',20+doc.getTextWidth(ta)+4,fy-34,46,29.1)}catch(e){}doc.setTextColor(0)}
  doc.setFontSize(11);doc.text('Informations de règlement :',20,fy);doc.setFont('helvetica','normal');
  doc.text(["Merci d'effectuer un virement bancaire.",'IBAN : FR76 1027 8021 2600 0607 4734 504','BIC : CMCIFR2A'],20,fy+5);
  doc.setFont('helvetica','bold');doc.text('Mentions légales obligatoires :',20,fy+22);doc.setFont('helvetica','normal');
  doc.text(doc.splitTextToSize('Association régie par la loi du 1er juillet 1901 - SIRET : 324426303700040\nTVA non applicable - Article 293 B du CGI (Exonération de TVA pour les activités associatives)',170),20,fy+27);
  var name='Facture-'+num+'-'+d.name.replace(/[\\\/:*?"<>|]/g,'').trim()+'.pdf';
  var path=num+'.pdf',up=await sb.storage.from('factures').upload(path,doc.output('blob'),{contentType:'application/pdf'});if(up.error)throw up.error;
  var ins=await sb.from('factures').insert({num:num,date:date,dest:d.name,ttc:T,name:name,path:path});if(ins.error)throw ins.error;
  L=[{lib:'',q:1,p:0}];F.dest='';A={on:false,date:'',mode:'Virement bancaire'};toast('Facture '+num+' archivée');busy=false;await go(4);return;
 }catch(e){toast('Erreur : '+(e.message||e))}
 busy=false}
function p2(){return list('dest','Destinataire')}
function importCard(){return '<div class="card"><h3>Importer depuis un fichier Excel</h3><div style="color:var(--mu);font-size:13px;margin-bottom:10px">Colonnes attendues : Nom, Adresse, Code postal (et Ville si elle est dans une colonne à part). Une ligne par destinataire, la ligne de titres est facultative. Une colonne facultative « Groupe » (club ou autre) permet de classer chaque ligne. Les destinataires déjà présents sont ignorés.</div><label>Groupe par défaut des destinataires importés</label><select id="xg" style="margin-bottom:10px"><option value="club">Clubs</option><option value="autre">Autres</option></select><input type="file" id="xl" accept=".xlsx,.xls" onchange="importXl(this)"></div>'}
function cell(v){return String(v==null?'':v).trim()}
async function importXl(inp){
 var f=inp.files[0];if(!f||busy)return;
 if(!window.XLSX){inp.value='';return toast('Lecture Excel indisponible')}
 busy=true;toast('Import en cours…');
 try{
  var wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
  var dg=($('xg')||{}).value||'club',ix={n:0,a:1,c:2,v:3,g:-1},hs=(rows[0]||[]).map(function(x){return cell(x).toLowerCase()}),hn=hs.findIndex(function(x){return /nom|destinataire/.test(x)});
  if(hn>=0){ix.n=hn;var a=hs.findIndex(function(x){return /adresse/.test(x)}),c=hs.findIndex(function(x){return /code|cp|postal/.test(x)}),v=hs.findIndex(function(x){return /ville/.test(x)});
   if(a>=0)ix.a=a;if(c>=0)ix.c=c;ix.v=v;ix.g=hs.findIndex(function(x){return /groupe|type|cat/.test(x)});rows=rows.slice(1)}
  var seen={};S.dest.forEach(function(x){seen[(x.name+'|'+(x.addr||'')).toLowerCase()]=1});
  var ok=0,dup=0;
  for(var r of rows){
   var name=cell(r[ix.n]);if(!name)continue;
   var addr=cell(r[ix.a]),cp=cell(r[ix.c]),gv=ix.g>=0?cell(r[ix.g]).toLowerCase():'';if(/^\d{1,4}$/.test(cp))cp=cp.padStart(5,'0');
   var city=[cp,ix.v>=0?cell(r[ix.v]):''].filter(Boolean).join(' '),key=(name+'|'+addr).toLowerCase();
   if(seen[key]){dup++;continue}
   seen[key]=1;var rr=await sb.from('destinataires').insert({name:name,addr:addr,city:city,groupe:gv?(/club/.test(gv)?'club':'autre'):dg});if(rr.error)throw rr.error;ok++}
  toast(ok+' destinataire(s) ajouté(s)'+(dup?', '+dup+' doublon(s) ignoré(s)':''));
 }catch(e){toast('Erreur d’import : '+(e.message||e))}
 inp.value='';busy=false;await refresh();render()}
function p3(){return list('lib','Libellés')}
function list(k,title){
 var arr=S[k],e=(ED&&ED.k==k)?arr[ED.i]:null;
 return '<div class="card"><h2>'+title+(e?' — modification':'')+'</h2>'
 +FLD[k].map(function(f,i){if(f[0]=='groupe'){var g=e?grp(e):'club';return '<label>'+f[1]+'</label><select id="f'+i+'"><option value="club"'+(g=='club'?' selected':'')+'>Club</option><option value="autre"'+(g=='autre'?' selected':'')+'>Autre</option></select>'}return '<label>'+f[1]+'</label><input id="f'+i+'"'+(f[0]=='price'?' type="number" min="0" step="0.01"':'')+' value="'+esc(e&&e[f[0]]!=null?e[f[0]]:'')+'">'}).join('')
 +'<div style="margin-top:14px;display:flex;gap:8px"><button class="btn" onclick="add(\''+k+'\')">'+(e?'Enregistrer':'Ajouter')+'</button>'+(e?'<button class="btn s" onclick="ED=null;render()">Annuler</button>':'')+'</div></div>'
 +(k=='dest'?importCard():'')+'<div class="card">'+(arr.length?arr.map(function(x,i){
  var sub=k=='lib'?eur(x.price):[x.addr,x.city].filter(Boolean).map(esc).join('<br>'),hd=(k=='dest'&&(i==0||grp(arr[i-1])!=grp(x)))?'<div class="gh">'+(grp(x)=='club'?'Clubs':'Autres')+'</div>':'';
  return hd+'<div class="it"><div><b>'+esc(x.name)+'</b><small>'+sub+'</small></div><div class="acts"><button class="btn s" onclick="edit(\''+k+'\','+i+')">Modifier</button><button class="btn d" onclick="delItem(\''+k+'\','+i+')">Supprimer</button></div></div>'}).join(''):'<div class="empty">Aucun élément pour le moment.</div>')+'</div>'}
function edit(k,i){ED={k:k,i:i};render();window.scrollTo(0,0)}
function p4(){
 return '<div class="card"><h2>Archives ('+S.arch.length+')</h2>'+(S.arch.length?S.arch.map(function(a,i){
  return '<div class="it"><div><b>'+esc(a.name)+'</b><small>'+fr(a.date)+' · '+eur(a.ttc)+'</small></div><div class="acts"><button class="btn s" onclick="dl('+i+')">Télécharger</button><button class="btn d" onclick="delArch('+i+')">✕</button></div></div>'}).join(''):'<div class="empty">Aucune facture archivée.</div>')+'</div>'}
init();
</script></body></html>
